<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gru WebView</title>
  <style>
    :root {
      --bg: #e4e5eb;
      --ink: #1a1c22;
      --accent: #2f6fed;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(165deg, #d8dae3 0%, var(--bg) 45%, #cfd3de 100%);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    p.lead {
      margin: 0 0 1.5rem;
      opacity: 0.75;
      line-height: 1.45;
    }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 0.75rem 1.1rem;
      font-size: 1rem;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: #3a3f4d; }
    #log {
      flex: 1;
      background: var(--card);
      border-radius: 12px;
      padding: 1rem;
      font-family: ui-monospace, monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      min-height: 8rem;
      box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    }
  </style>
</head>
<body>
  <h1>Gru WebView</h1>
  <p class="lead">Full-window Android WebView with a Go JNI bridge. Ping echoes through native code.</p>
  <div class="row">
    <button type="button" id="ping">Ping Go</button>
    <button type="button" class="secondary" id="clear">Clear</button>
  </div>
  <div id="log">Ready.
</div>
  <script>
    const logEl = document.getElementById('log');
    function log(line) {
      logEl.textContent += line + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }
    window.__gruOnGo = function (msg) {
      log('go→js: ' + msg);
    };
    document.getElementById('ping').onclick = function () {
      const payload = 'ping@' + new Date().toISOString();
      log('js→go: ' + payload);
      if (window.gru && typeof window.gru.postMessage === 'function') {
        window.gru.postMessage(payload);
      } else {
        log('(bridge missing — not running in Gru WebView APK)');
      }
    };
    document.getElementById('clear').onclick = function () {
      logEl.textContent = '';
    };
  </script>
</body>
</html>
