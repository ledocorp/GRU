<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>gru-video-player</title>
<style>
  :root {
    font-family: system-ui, "Segoe UI", sans-serif;
    color: #0f172a;
    background: #0b1220;
    --muted: #94a3b8;
    --panel: #111827;
    --border: #1e293b;
  }
  [data-gru-theme="dark"] { color: #e2e8f0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--panel); }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    padding: 16px;
    gap: 10px;
  }
  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: #e2e8f0;
  }
  #meta { font-size: 12px; color: var(--muted); min-height: 1.2em; word-break: break-all; }
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow: hidden;
    min-height: 180px;
  }
  video {
    width: 100%;
    height: 100%;
    max-height: 70vh;
    object-fit: contain;
    background: #000;
  }
  #gru-toast.gru-toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    padding: 10px 16px; border-radius: 8px; background: #1e293b; color: #e2e8f0;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s;
    border: 1px solid var(--border); z-index: 9;
  }
  #gru-toast.gru-toast.show { opacity: 1; }
  #gru-toast.gru-toast.error { border-color: #f87171; }
</style>
<script src="https://gru.media/web/gru.js"></script>
</head>
<body data-gru-theme="dark">
  <h1 id="title">gru-video-player</h1>
  <div id="meta">Waiting for Go…</div>
  <div class="stage">
    <video id="clip" controls playsinline preload="metadata"></video>
  </div>
<script>
(function () {
  const clip = document.getElementById('clip');
  const meta = document.getElementById('meta');
  const title = document.getElementById('title');

  function post(name, payload) {
    if (!window.gru || !window.gru.postMessage) return;
    window.gru.postMessage(JSON.stringify({
      type: 'gru.bridge', v: 1, name: name, payload: payload || {}
    }));
  }

  clip.addEventListener('loadedmetadata', function () {
    post('video.metadata', {
      duration: clip.duration,
      width: clip.videoWidth,
      height: clip.videoHeight
    });
  });
  clip.addEventListener('play', function () { post('video.state', { playing: true }); });
  clip.addEventListener('pause', function () { post('video.state', { playing: false }); });
  clip.addEventListener('error', function () {
    const err = clip.error ? clip.error.message || ('code ' + clip.error.code) : 'unknown';
    meta.textContent = 'Decode error: ' + err;
    post('video.error', { message: err });
  });

  function load(payload) {
    const src = payload && payload.src;
    const name = (payload && payload.name) || 'clip';
    title.textContent = name;
    meta.textContent = 'Loading…';
    clip.pause();
    clip.removeAttribute('src');
    clip.load();
    if (!src) {
      meta.textContent = 'No source.';
      return;
    }
    clip.src = src;
    clip.load();
    meta.textContent = src;
  }

  function pauseAll() {
    clip.pause();
  }

  function applyTheme(payload) {
    const theme = (payload && payload.theme) || 'dark';
    document.body.setAttribute('data-gru-theme', theme);
  }

  if (window.gru && window.gru.on) {
    window.gru.on('video.load', load);
    window.gru.on('video.pause', pauseAll);
    window.gru.on('theme', applyTheme);
  }

  function signalReady() {
    post('player.ready', {});
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', signalReady);
  } else {
    signalReady();
  }
})();
</script>
</body>
</html>
